<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" role="img" aria-labelledby="bearAskTitle bearAskDesc">
  <title id="bearAskTitle">A shy little bear holding a pink heart</title>
  <desc id="bearAskDesc">An animated kawaii teddy bear with rosy cheeks waving one paw while hugging a beating heart.</desc>

  <defs>
    <radialGradient id="askBg" cx="50%" cy="34%" r="82%">
      <stop offset="0" stop-color="#FFF3F8"/>
      <stop offset="52%" stop-color="#FFDCEB"/>
      <stop offset="100%" stop-color="#D8C6FF"/>
    </radialGradient>

    <radialGradient id="askFur" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#FADCC3"/>
      <stop offset="62%" stop-color="#F3CDAC"/>
      <stop offset="100%" stop-color="#E5B490"/>
    </radialGradient>

    <linearGradient id="askHeart" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF8FB6"/>
      <stop offset="0.55" stop-color="#FF4F87"/>
      <stop offset="1" stop-color="#E62E67"/>
    </linearGradient>

    <radialGradient id="askBubble" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </radialGradient>

    <filter id="askBlush" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="askGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="askShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8A4A76" flood-opacity="0.22"/>
    </filter>
  </defs>

  <style>
    /* ---- shared easing ---- */
    .bob      { animation: bob 3.6s ease-in-out infinite; }
    .bob-slow { animation: bob 5.2s ease-in-out infinite; }
    .wave     { animation: wave 1.5s ease-in-out infinite; }
    .pulse    { animation: pulse 1.9s ease-in-out infinite; }
    .float-1  { animation: float 6s   ease-in-out infinite; }
    .float-2  { animation: float 7.4s ease-in-out infinite; animation-delay: -2.2s; }
    .float-3  { animation: float 8.6s ease-in-out infinite; animation-delay: -4.1s; }
    .twinkle  { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle-2{ animation: twinkle 4.4s ease-in-out infinite; animation-delay: -1.6s; }
    .blink-open  { animation: blinkOpen 4.6s steps(1, end) infinite; }
    .blink-shut  { animation: blinkShut 4.6s steps(1, end) infinite; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(-13deg); }
      50%      { transform: rotate(15deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      18%      { transform: scale(1.1); }
      36%      { transform: scale(0.99); }
      54%      { transform: scale(1.06); }
    }
    @keyframes float {
      0%   { transform: translate3d(0, 10px, 0) scale(0.94); opacity: 0.15; }
      45%  { opacity: 0.85; }
      100% { transform: translate3d(6px, -26px, 0) scale(1.06); opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50%      { opacity: 0.95; transform: scale(1.12); }
    }
    @keyframes blinkOpen { 0%, 90% { opacity: 1; } 91%, 100% { opacity: 0; } }
    @keyframes blinkShut { 0%, 90% { opacity: 0; } 91%, 100% { opacity: 1; } }

    .wave, .pulse, .bob, .bob-slow, .float-1, .float-2, .float-3, .twinkle, .twinkle-2 {
      transform-box: view-box;
    }
    .wave { transform-origin: 172px 196px; }
    .pulse { transform-origin: 78px 176px; }
    .bob, .bob-slow { transform-origin: 130px 240px; }
    .float-1 { transform-origin: 48px 96px; }
    .float-2 { transform-origin: 206px 74px; }
    .float-3 { transform-origin: 92px 42px; }
    .twinkle, .twinkle-2 { transform-origin: center; }

    @media (prefers-reduced-motion: reduce) {
      .bob, .bob-slow, .wave, .pulse, .float-1, .float-2, .float-3,
      .twinkle, .twinkle-2, .blink-open, .blink-shut { animation: none; }
      .blink-shut { opacity: 0; }
      .blink-open { opacity: 1; }
    }
  </style>

  <!-- background -->
  <rect width="260" height="260" fill="url(#askBg)"/>
  <circle cx="196" cy="214" r="66" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="38" cy="66" r="46" fill="#FFFFFF" opacity="0.22"/>

  <!-- transparent bubbles -->
  <g>
    <circle class="bob-slow" cx="62" cy="196" r="15" fill="url(#askBubble)" stroke="#FFFFFF" stroke-opacity="0.7"/>
    <circle class="bob" cx="204" cy="150" r="9" fill="url(#askBubble)" stroke="#FFFFFF" stroke-opacity="0.6"/>
    <circle class="bob-slow" cx="222" cy="52" r="6" fill="url(#askBubble)" stroke="#FFFFFF" stroke-opacity="0.6"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path class="twinkle" d="M36 118l2.4 6.1 6.1 2.4-6.1 2.4L36 135l-2.4-6.1-6.1-2.4 6.1-2.4z" opacity="0.95"/>
    <path class="twinkle-2" d="M228 96l1.9 4.8 4.8 1.9-4.8 1.9L228 109l-1.9-4.8-4.8-1.9 4.8-1.9z" opacity="0.9"/>
    <path class="twinkle" d="M186 30l1.6 4.2 4.2 1.6-4.2 1.6L186 41l-1.6-4.2-4.2-1.6 4.2-1.6z" opacity="0.8" style="animation-delay:-2s"/>
  </g>

  <!-- floating hearts -->
  <g>
    <path class="float-1" d="M48 96c-3.6-4.3-10.6-3.2-10.6 2.4 0 4.6 6.4 8.2 10.6 11.6 4.2-3.4 10.6-7 10.6-11.6 0-5.6-7-6.7-10.6-2.4z" fill="#FF6F9C" opacity="0.6"/>
    <path class="float-2" d="M206 74c-2.7-3.2-8-2.4-8 1.8 0 3.5 4.8 6.2 8 8.7 3.2-2.5 8-5.2 8-8.7 0-4.2-5.3-5-8-1.8z" fill="#B69CFF" opacity="0.7"/>
    <path class="float-3" d="M92 42c-2.2-2.6-6.5-2-6.5 1.5 0 2.8 3.9 5 6.5 7 2.6-2 6.5-4.2 6.5-7 0-3.5-4.3-4.1-6.5-1.5z" fill="#FFB38A" opacity="0.65"/>
  </g>

  <!-- soft ground shadow -->
  <ellipse cx="130" cy="232" rx="72" ry="13" fill="#B0759F" opacity="0.16" filter="url(#askBlush)"/>

  <g class="bob">
    <!-- ears -->
    <g>
      <circle cx="86" cy="78" r="25" fill="url(#askFur)"/>
      <circle cx="174" cy="78" r="25" fill="url(#askFur)"/>
      <circle cx="86" cy="81" r="13.5" fill="#F49FBC"/>
      <circle cx="174" cy="81" r="13.5" fill="#F49FBC"/>
    </g>

    <!-- body -->
    <ellipse cx="130" cy="204" rx="54" ry="44" fill="url(#askFur)"/>
    <ellipse cx="130" cy="212" rx="31" ry="30" fill="#FFF3E9"/>

    <!-- left arm (hugging the heart) -->
    <path d="M84 190c-12 4-18 13-16 22" fill="none" stroke="#E5B490" stroke-width="20" stroke-linecap="round"/>
    <!-- right arm (waving) -->
    <g class="wave">
      <path d="M176 196c11-1 19-9 22-19" fill="none" stroke="#E5B490" stroke-width="20" stroke-linecap="round"/>
      <circle cx="199" cy="175" r="11" fill="#F7D6BC"/>
    </g>

    <!-- head -->
    <g filter="url(#askShadow)">
      <circle cx="130" cy="120" r="63" fill="url(#askFur)"/>
    </g>

    <!-- blush -->
    <g filter="url(#askBlush)" opacity="0.85">
      <ellipse cx="86" cy="136" rx="15" ry="9.5" fill="#FF7EA6"/>
      <ellipse cx="174" cy="136" rx="15" ry="9.5" fill="#FF7EA6"/>
    </g>

    <!-- muzzle -->
    <ellipse cx="130" cy="143" rx="38" ry="28" fill="#FFF3E9"/>

    <!-- eyes -->
    <g>
      <g class="blink-open">
        <ellipse cx="104" cy="112" rx="8.4" ry="10.4" fill="#3A232D"/>
        <ellipse cx="156" cy="112" rx="8.4" ry="10.4" fill="#3A232D"/>
        <circle cx="101" cy="108" r="3.1" fill="#FFFFFF"/>
        <circle cx="153" cy="108" r="3.1" fill="#FFFFFF"/>
        <circle cx="107.4" cy="116" r="1.7" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="159.4" cy="116" r="1.7" fill="#FFFFFF" opacity="0.8"/>
      </g>
      <g class="blink-shut" opacity="0">
        <path d="M96 113q8-8 16 0" fill="none" stroke="#3A232D" stroke-width="4.4" stroke-linecap="round"/>
        <path d="M148 113q8-8 16 0" fill="none" stroke="#3A232D" stroke-width="4.4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- nose + smile -->
    <path d="M123.5 131h13c1.4 0 2.2 1.3 1.5 2.5l-6.5 6.6-6.5-6.6c-.7-1.2 0-2.5 1.5-2.5z" fill="#7C4E42"/>
    <path d="M130 140v4.4M130 144.4c-2.6 4.4-8.4 4.2-10-1M130 144.4c2.6 4.4 8.4 4.2 10-1"
          fill="none" stroke="#7C4E42" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- beating heart hugged by the bear -->
  <g class="pulse">
    <ellipse cx="78" cy="176" rx="26" ry="26" fill="#FF5C93" opacity="0.35" filter="url(#askGlow)"/>
    <path d="M78 158c-6.8-8.8-21.4-6.6-21.4 4.6 0 9.2 12.6 16.4 21.4 23.6 8.8-7.2 21.4-14.4 21.4-23.6 0-11.2-14.6-13.4-21.4-4.6z" fill="url(#askHeart)"/>
    <path d="M68 162c-2.8-3.2-8.4-2.2-8.4 2.4 0 2.6 2.6 4.8 5.6 6.8" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" opacity="0.72"/>
  </g>
</svg>
