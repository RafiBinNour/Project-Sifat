<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" role="img" aria-labelledby="bearHappyTitle bearHappyDesc">
  <title id="bearHappyTitle">A joyful little bear cheering with both paws up</title>
  <desc id="bearHappyDesc">An animated kawaii teddy bear with closed happy eyes, blushing cheeks, confetti and a floating heart above its head.</desc>

  <defs>
    <radialGradient id="hapBg" cx="52%" cy="32%" r="84%">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="48%" stop-color="#FFE1EF"/>
      <stop offset="100%" stop-color="#DCC8FF"/>
    </radialGradient>

    <radialGradient id="hapFur" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#FBE2CB"/>
      <stop offset="62%" stop-color="#F4D2B2"/>
      <stop offset="100%" stop-color="#E6B996"/>
    </radialGradient>

    <linearGradient id="hapHeart" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFA2C4"/>
      <stop offset="0.55" stop-color="#FF5C93"/>
      <stop offset="1" stop-color="#E62E67"/>
    </linearGradient>

    <radialGradient id="hapBubble" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </radialGradient>

    <filter id="hapBlush" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="hapGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="hapShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8A4A76" flood-opacity="0.22"/>
    </filter>
  </defs>

  <style>
    .cheer     { animation: cheer 1.6s ease-in-out infinite; }
    .cheer-r   { animation: cheerR 1.6s ease-in-out infinite; }
    .hop       { animation: hop 1.6s ease-in-out infinite; }
    .pulse     { animation: pulse 1.4s ease-in-out infinite; }
    .twinkle   { animation: twinkle 2.6s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 3.4s ease-in-out infinite; animation-delay: -1.2s; }
    .confetti-fall { animation: confettiFall 4.4s linear infinite; }
    .float-1   { animation: float 5.6s ease-in-out infinite; }
    .float-2   { animation: float 7s   ease-in-out infinite; animation-delay: -2.6s; }
    .spin      { animation: spin 9s linear infinite; }

    @keyframes cheer  { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(10deg); } }
    @keyframes cheerR { 0%,100% { transform: rotate(14deg); }  50% { transform: rotate(-10deg); } }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      40%      { transform: translateY(-8px) scale(0.99, 1.02); }
      72%      { transform: translateY(2px) scale(1.02, 0.98); }
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 30% { transform: scale(1.13); } 60% { transform: scale(1.02); } }
    @keyframes twinkle { 0%,100% { opacity: 0.25; transform: scale(0.75); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes confettiFall {
      0%   { transform: translateY(-18px) rotate(0deg); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateY(150px) rotate(220deg); opacity: 0; }
    }
    @keyframes float {
      0%   { transform: translate3d(0, 12px, 0) scale(0.9); opacity: 0.12; }
      45%  { opacity: 0.9; }
      100% { transform: translate3d(7px, -28px, 0) scale(1.08); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cheer   { transform-origin: 174px 190px; }
    .cheer-r { transform-origin: 86px 190px; }
    .hop     { transform-origin: 130px 236px; }
    .pulse   { transform-origin: 130px 56px; }
    .twinkle, .twinkle-2 { transform-origin: center; }
    .spin    { transform-origin: 130px 56px; }

    @media (prefers-reduced-motion: reduce) {
      .cheer, .cheer-r, .hop, .pulse, .twinkle, .twinkle-2,
      .confetti-fall, .float-1, .float-2, .spin { animation: none; }
    }
  </style>

  <!-- background -->
  <rect width="260" height="260" fill="url(#hapBg)"/>
  <circle cx="54" cy="66" r="52" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="210" cy="206" r="62" fill="#FFFFFF" opacity="0.22"/>

  <!-- bubbles -->
  <circle class="float-1" cx="46" cy="204" r="13" fill="url(#hapBubble)" stroke="#FFFFFF" stroke-opacity="0.65"/>
  <circle class="float-2" cx="216" cy="120" r="10" fill="url(#hapBubble)" stroke="#FFFFFF" stroke-opacity="0.6"/>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path class="twinkle" d="M38 104l2.6 6.6 6.6 2.6-6.6 2.6L38 122.4l-2.6-6.6-6.6-2.6 6.6-2.6z"/>
    <path class="twinkle-2" d="M222 68l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path class="twinkle" d="M198 176l1.7 4.4 4.4 1.7-4.4 1.7-1.7 4.4-1.7-4.4-4.4-1.7 4.4-1.7z" style="animation-delay:-1.8s"/>
  </g>

  <!-- falling confetti -->
  <g>
    <rect class="confetti-fall" x="60"  y="10" width="6" height="11" rx="2.6" fill="#FF4F87" transform="rotate(18 63 16)"/>
    <rect class="confetti-fall" x="106" y="4"  width="5" height="9"  rx="2.2" fill="#B69CFF" style="animation-delay:-1.1s" transform="rotate(-24 108 9)"/>
    <rect class="confetti-fall" x="152" y="8"  width="6" height="10" rx="2.6" fill="#FFB38A" style="animation-delay:-2.3s" transform="rotate(36 155 13)"/>
    <rect class="confetti-fall" x="196" y="2"  width="5" height="9"  rx="2.2" fill="#FFDFA6" style="animation-delay:-3.2s" transform="rotate(-12 198 7)"/>
    <rect class="confetti-fall" x="82"  y="6"  width="4" height="8"  rx="2"   fill="#FFFFFF" style="animation-delay:-0.6s" transform="rotate(52 84 10)"/>
  </g>

  <!-- radiating glow behind the heart -->
  <circle class="spin" cx="130" cy="56" r="30" fill="none" stroke="#FFC2D8" stroke-width="2" stroke-dasharray="4 9" opacity="0.85"/>

  <!-- floating heart -->
  <g class="pulse">
    <circle cx="130" cy="56" r="26" fill="#FF5C93" opacity="0.3" filter="url(#hapGlow)"/>
    <path d="M130 36c-7.4-9.6-23.2-7.2-23.2 5 0 10 13.7 17.8 23.2 25.6 9.5-7.8 23.2-15.6 23.2-25.6 0-12.2-15.8-14.6-23.2-5z" fill="url(#hapHeart)"/>
    <path d="M119 41c-3-3.4-9-2.4-9 2.6 0 2.8 2.8 5.2 6 7.4" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- secondary floating hearts -->
  <g>
    <path class="float-1" d="M44 140c-2.6-3.2-7.8-2.4-7.8 1.8 0 3.4 4.6 6 7.8 8.6 3.2-2.6 7.8-5.2 7.8-8.6 0-4.2-5.2-5-7.8-1.8z" fill="#FF7EA6" opacity="0.72"/>
    <path class="float-2" d="M214 158c-2.2-2.7-6.6-2-6.6 1.5 0 2.9 3.9 5.1 6.6 7.3 2.7-2.2 6.6-4.4 6.6-7.3 0-3.5-4.4-4.2-6.6-1.5z" fill="#B69CFF" opacity="0.75"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="130" cy="236" rx="66" ry="12" fill="#B0759F" opacity="0.16" filter="url(#hapBlush)"/>

  <g class="hop">
    <!-- ears -->
    <circle cx="86" cy="84" r="24" fill="url(#hapFur)"/>
    <circle cx="174" cy="84" r="24" fill="url(#hapFur)"/>
    <circle cx="86" cy="87" r="13" fill="#F49FBC"/>
    <circle cx="174" cy="87" r="13" fill="#F49FBC"/>

    <!-- body -->
    <ellipse cx="130" cy="206" rx="52" ry="42" fill="url(#hapFur)"/>
    <ellipse cx="130" cy="214" rx="30" ry="28" fill="#FFF3E9"/>

    <!-- arms cheering up -->
    <g class="cheer-r">
      <path d="M92 198c-12-6-18-18-18-30" fill="none" stroke="#E6B996" stroke-width="19" stroke-linecap="round"/>
      <circle cx="74" cy="166" r="10.5" fill="#F8D7BE"/>
    </g>
    <g class="cheer">
      <path d="M168 198c12-6 18-18 18-30" fill="none" stroke="#E6B996" stroke-width="19" stroke-linecap="round"/>
      <circle cx="186" cy="166" r="10.5" fill="#F8D7BE"/>
    </g>

    <!-- head -->
    <g filter="url(#hapShadow)">
      <circle cx="130" cy="126" r="60" fill="url(#hapFur)"/>
    </g>

    <!-- blush -->
    <g filter="url(#hapBlush)" opacity="0.9">
      <ellipse cx="88" cy="142" rx="15" ry="9.5" fill="#FF7EA6"/>
      <ellipse cx="172" cy="142" rx="15" ry="9.5" fill="#FF7EA6"/>
    </g>

    <!-- muzzle -->
    <ellipse cx="130" cy="148" rx="36" ry="27" fill="#FFF3E9"/>

    <!-- happy closed eyes -->
    <g stroke="#3A232D" stroke-width="4.6" stroke-linecap="round" fill="none">
      <path d="M96 122q9-11 18 0"/>
      <path d="M146 122q9-11 18 0"/>
    </g>

    <!-- open smiling mouth -->
    <path d="M118 148q12 14 24 0" fill="#7C4E42" opacity="0.92"/>
    <path d="M122 152q8 8 16 0q-8 4-16 0z" fill="#FF8FAE"/>
    <path d="M124.5 140h11c1.3 0 2 1.2 1.4 2.3l-5.6 5.8-5.6-5.8c-.6-1.1.1-2.3 1.4-2.3z" fill="#7C4E42"/>
  </g>
</svg>
